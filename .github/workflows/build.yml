name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Build (release)
        run: swift build -c release

      - name: Run tests
        run: swift test

      - name: Assemble .app
        run: |
          chmod +x scripts/build-app.sh
          ./scripts/build-app.sh

      - name: Upload .app artifact
        uses: actions/upload-artifact@v4
        with:
          name: ModelStatus-app
          path: build/ModelStatus.app
          if-no-files-found: error
